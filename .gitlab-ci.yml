stages:
  - build
  - test

# Succeeds if no changes are suggested by gofmt -d .
gofmt:
  stage: test
  image: golang:1.25
  script: if gofmt -d . | grep . ; then false ; else true ; fi

staticcheck v0.6.1:
  stage: test
  image: golang:1.25
  script:
    - go install honnef.co/go/tools/cmd/staticcheck@v0.6.1
    - staticcheck ./...

compile go 1.25:
  stage: build
  image: golang:1.25
  script:
    - go build -v ./...

unittests:
  stage: test
  image: golang:1.25
  script:
    - go test -race -v ./...

coverage:
  stage: test
  image: golang:1.25
  script:
    - go test ./... -coverprofile=coverage.txt -covermode count
    - go install github.com/boumenot/gocover-cobertura@latest
    - gocover-cobertura < coverage.txt > coverage.xml
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

integration test:
  stage: test
  image: golang:1.25
  before_script:
    - apt-get update
    - apt-get install -qqy openssl openssh-client jq unzip file sbsigntool make
  script:
    - make check

stboot integration:
  stage: test
  image: debian:trixie
  allow_failure: true
  # Debian trixie has go 1.24, rely on go itself installing 1.25 that we use
  before_script:
    - apt-get update
    - apt-get install -qqy golang qemu-system-x86 wget parted e2fsprogs mtools cpio dosfstools git unzip
  script:
    - git clone https://git.glasklar.is/system-transparency/core/stboot.git
    - cd stboot/integration && go work init && go work use . ../.. && ./qemu-boot-from-disk.sh
  artifacts:
    when: always
    paths:
      - stboot/integration/out/qemu.log
